server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls /api. Twilio calls /webhooks, so one public URL (for example an ngrok
    # tunnel to port 3000) serves both the dashboard and the webhook.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # Single page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
